name: CI

on:
  push:
    branches: [ master, main, develop, max-bot-complete-2026 ]
  pull_request:
    branches: [ master, main, develop, max-bot-complete-2026, claude/chat-bot-survey-publik-nq2w1s ]

jobs:
  # MAX bot: Python syntax/import checks plus durable-storage, outbox and webhook tests.
  max-bot-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sdut_test
          POSTGRES_USER: sdut_test
          POSTGRES_DB: sdut_test
        options: >-
          --health-cmd "pg_isready -U sdut_test -d sdut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      SDUT_DATABASE_URL: postgresql://sdut_test:sdut_test@127.0.0.1:5432/sdut_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check committed secrets
        run: python scripts/check_secrets.py

      - name: Check outbound architecture
        run: python scripts/check_outbound_paths.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Apply PostgreSQL migrations
        run: python scripts/migrate_postgres.py

      - name: Run MAX bot tests
        run: |
          python -m pytest -q \
            tests/test_launcher_security.py \
            tests/test_storage_sqlite.py \
            tests/test_storage_postgres.py \
            tests/test_outbox_postgres.py \
            tests/test_production_outbox.py \
            tests/test_production_e2e.py \
            tests/test_outbox_multiworker.py \
            tests/test_migration_guard.py \
            tests/test_durable_outbox_worker.py \
            tests/test_durable_outbox_crash_boundary.py \
            tests/test_webhook_config.py \
            tests/test_crm_outbox.py

  # Go Backend Tests
  go-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: telegram_emulator
          POSTGRES_USER: telegram_emulator
          POSTGRES_DB: telegram_emulator
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options:
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: true

    - name: Install Go dependencies
      run: |
        go mod download
        go mod verify

    - name: Run Go linter
      uses: golangci/golangci-lint-action@v4
      with:
        version: v1.64.8
        args: --timeout=10m

    - name: Run Go tests
      run: |
        go test ./... -race -coverprofile=coverage.out -covermode=atomic

    - name: Upload Go coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage.out
        flags: go-backend
        name: go-backend-coverage

    - name: Build Go binary
      run: |
        go build -o bin/telegram-emulator ./cmd/emulator

  # React Frontend Tests
  react-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd web
        npm ci

    - name: Run ESLint
      run: |
        cd web
        npm run lint

    - name: Build frontend
      run: |
        cd web
        npm run build

  # Security Scan
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    # Note: SARIF upload remains disabled until repository security integration is configured.
