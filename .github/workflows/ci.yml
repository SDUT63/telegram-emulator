name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop, max-bot-complete-2026 ]
  pull_request:
    branches: [ master, main, develop, max-bot-complete-2026 ]

permissions:
  contents: read

jobs:
  max-bot-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sdut_test
          POSTGRES_USER: sdut_test
          POSTGRES_DB: sdut_test
        options: >-
          --health-cmd "pg_isready -U sdut_test -d sdut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports: [5432:5432]
    env:
      SDUT_DATABASE_URL: postgresql://sdut_test:sdut_test@127.0.0.1:5432/sdut_test
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Check committed secrets
        run: python scripts/check_secrets.py
      - name: Check outbound architecture
        run: python scripts/check_outbound_paths.py
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Apply PostgreSQL migrations
        run: python scripts/migrate_postgres.py
      - name: Run Python tests
        run: python -m pytest -q tests

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69c9af683
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
