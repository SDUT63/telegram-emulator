groups:
  - name: sdut-max-bot
    rules:
      - alert: SDUTStorageDown
        expr: sdut_storage_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SDUT MAX bot cannot reach PostgreSQL"
          description: "The bot readiness/storage health check has been failing for more than 2 minutes."

      - alert: SDUTOutboxDeadMessages
        expr: sdut_outbox_messages{status="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SDUT MAX outbox contains dead messages"
          description: "One or more outbound messages exhausted their retry budget."

      - alert: SDUTOutboxBacklog
        expr: sdut_outbox_messages{status="pending"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SDUT MAX outbound queue is growing"
          description: "More than 100 pending outbound messages have remained for 10 minutes."

      - alert: SDUTOutboxProviderFailures
        expr: increase(sdut_outbox_delivery_failures_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SDUT MAX provider delivery failures are elevated"
          description: "More than 10 outbound delivery failures occurred in the last 10 minutes."

      - alert: SDUTServiceRestartLoop
        expr: sdut_process_uptime_seconds < 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SDUT MAX service is restarting"
          description: "The process has been up for less than 5 minutes for 10 consecutive minutes."
