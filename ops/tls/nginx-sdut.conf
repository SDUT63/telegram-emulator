# СДУТ: обратный прокси с TLS для вебхука MAX.
#
# MAX доставляет события только на HTTPS и только на порт 443. Сам бот
# слушает 127.0.0.1:8080 без шифрования — и правильно делает: TLS
# заканчивается здесь, а до бота остаётся петля внутри машины.
#
# Наружу открыт ровно один путь — тот, на который приходят события.
# /metrics отдаёт счётчики, /health говорит о состоянии базы, и оба
# не нужны никому в интернете. Всё, кроме вебхука, отвечает 404.
#
# Установка:
#   sudo cp ops/tls/nginx-sdut.conf /etc/nginx/sites-available/sdut
#   sudo ln -s /etc/nginx/sites-available/sdut /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Перед этим замените ПОСТАВЬТЕ_СВОЙ_ДОМЕН на настоящее имя и получите
# сертификат — как, написано в ops/tls/README.md.

# Ограничение частоты. Бот публичный: ссылку на него видят все, кому
# показали рекламу. Десять запросов в секунду с одного адреса — это
# вдесятеро больше, чем нужно человеку, и вдесятеро меньше, чем нужно
# тому, кто решит забить очередь. Всплеск в двадцать пропускается без
# задержки: MAX иногда досылает накопленное пачкой.
limit_req_zone $binary_remote_addr zone=sdut_webhook:10m rate=10r/s;

# Журнал без персональных данных. В теле запроса — переписка людей,
# поэтому тело не логируется вовсе; в строке запроса у вебхука ничего
# нет, кроме пути. Адрес отправителя нужен, чтобы понять источник потока.
log_format sdut '$remote_addr $time_iso8601 "$request_method $uri" '
                '$status $body_bytes_sent $request_time';

server {
    listen 80;
    # Строку ниже раскомментируйте, если у сервера есть IPv6. Без него
    # nginx не поднимется вовсе: «socket() [::]:80 failed (97: Address
    # family not supported by protocol)». Проверено.
    # listen [::]:80;
    server_name ПОСТАВЬТЕ_СВОЙ_ДОМЕН;

    # Единственное, ради чего оставлен незашифрованный порт, —
    # продление сертификата. Всё остальное уходит на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Так же, как выше: только для сервера с IPv6.
    # listen [::]:443 ssl;
    server_name ПОСТАВЬТЕ_СВОЙ_ДОМЕН;

    # HTTP/2 здесь намеренно не включён. Он выигрывает там, где браузер
    # тянет десятки файлов разом; вебхук — это одиночные POST от MAX,
    # и выигрыша нет. Зато синтаксис включения менялся между версиями
    # nginx (до 1.25 — «listen ... http2», с 1.25 — «http2 on»), и конфиг,
    # написанный под одну, не поднимается на другой. Проверено: на nginx
    # 1.24 из Ubuntu LTS «http2 on» — ошибка, а не предупреждение.

    ssl_certificate     /etc/letsencrypt/live/ПОСТАВЬТЕ_СВОЙ_ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ПОСТАВЬТЕ_СВОЙ_ДОМЕН/privkey.pem;

    # Только TLS 1.2 и 1.3. Всё, что старше, сломано, и MAX этого
    # не требует.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SdutTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    server_tokens off;

    access_log /var/log/nginx/sdut.log sdut;
    error_log  /var/log/nginx/sdut-error.log warn;

    # Событие MAX — это небольшой JSON. Мегабайт с запасом хватает
    # на любое из них и не даёт залить в бота файл.
    client_max_body_size 1m;
    client_body_timeout 10s;

    # ВНИМАНИЕ: путь должен совпадать с MAX_WEBHOOK_PATH и с путём
    # в MAX_WEBHOOK_URL. Бот проверяет это при старте и не поднимется,
    # если они разойдутся.
    location = /max {
        limit_req zone=sdut_webhook burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Бот отвечает MAX быстро: он кладёт событие в свою очередь
        # и возвращает ответ, а отправкой занимается отдельно. Если
        # ответа нет за десять секунд — что-то не так, и лучше отдать
        # ошибку, чем держать соединение.
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # Всё остальное наружу не выходит: ни /metrics со счётчиками,
    # ни /health, ни каталоги. Отвечаем 404, а не 403: знать, что
    # здесь что-то есть, посторонним незачем.
    location / {
        return 404;
    }
}

# --------------------------------------------------------------------
# CRM наружу по умолчанию НЕ открыта, и это не забывчивость.
#
# В ней имена, телефоны, адреса и сведения о здоровье. Открывать её
# в интернет можно только после разговора о том, кто получит доступ,
# и только вместе с ограничением круга: VPN службы или список адресов.
# Пароль оператора — не тот рубеж, за которым можно оставить такие
# сведения в открытой сети.
#
# Если решение принято, раскомментируйте и подставьте свои адреса:
#
# server {
#     listen 443 ssl;
#     server_name crm.ПОСТАВЬТЕ_СВОЙ_ДОМЕН;
#
#     ssl_certificate     /etc/letsencrypt/live/ПОСТАВЬТЕ_СВОЙ_ДОМЕН/fullchain.pem;
