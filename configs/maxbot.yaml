# Конфигурация чат-бота службы «Точка входа» для мессенджера MAX.
#
# Токен бота выдаёт MasterBot в MAX. Не храните его в репозитории:
# передавайте через переменную окружения MAXBOT_BOT_TOKEN.

bot:
  token: ""              # переменная окружения MAXBOT_BOT_TOKEN
  api_url: ""            # пусто — адрес MAX Bot API по умолчанию
  mode: polling          # polling или webhook
  timeout: 30s
  debug: false
  webhook:
    url: ""              # публичный адрес, например https://example.org/webhook
    listen: ":10888"
    path: "/webhook"
    secret: ""           # произвольная строка, проверяется заголовком X-Max-Bot-Api-Secret

database:
  url: "sqlite://data/maxbot.db"

organization:
  name: "АНО «Система долговременного ухода Тольятти»"
  service_name: "Точка входа"
  phone: ""              # телефон службы, например +7 (8482) 00-00-00
  work_hours: "по будням с 9:00 до 18:00"
  public_url: ""         # ссылка на паблик СДУ в MAX
  policy_url: ""         # ссылка на политику обработки персональных данных

# Получатели карточек обращений внутри MAX.
# chat_id — рабочий чат координаторов, user_ids — личные сообщения координаторам.
# Свой идентификатор можно узнать командой /id в диалоге с ботом.
coordinator:
  chat_id: 0
  user_ids: []

# Роли доступа к сведениям об обращениях.
# viewer — карточка без контактов, адреса и текста обращения;
# coordinator — полная карточка и закрытие действий;
# supervisor — то же, что координатор;
# admin — то же плюс настройка.
# Каждый просмотр карточки записывается в журнал случая.
access:
  viewers: []
  coordinators: []
  supervisors: []
  admins: []

# Утверждаемые правила службы — перечень STOP-1, матрица маршрутов и профиль
# собираемых данных — вынесены в отдельный файл: это нормативная часть,
# а не настройки приложения.
policies:
  path: "configs/policies.yaml"

# Формулировка согласия на обработку персональных данных.
#
# ВНИМАНИЕ. Текст должен соответствовать вашему утверждённому скрипту и политике
# обработки данных. В методических рекомендациях (фаза 7.5) используется
# формулировка «согласие можно отозвать в любой момент, тогда запись будет
# удалена». Отзыв согласия не всегда влечёт немедленное удаление всех записей:
# есть основания и сроки хранения, журнал аудита и отчётные документы. Поэтому
# по умолчанию бот отсылает к политике обработки данных, а не обещает удаление.
# Согласуйте окончательную формулировку с юристом и укажите её здесь.
# Оставьте закомментированным, чтобы использовалась формулировка по умолчанию.
# consent:
#   text: |
#     Чтобы мы могли работать с вашим обращением, нужно ваше согласие на обработку данных...

# Рабочий календарь: срок «один рабочий день» считается по нему, а не как +24 часа.
# Праздничные дни укажите списком дат в формате 2026-01-01.
working_calendar:
  timezone: "Europe/Samara"
  days: ["mon", "tue", "wed", "thu", "fri"]
  start: "09:00"
  end: "18:00"
  holidays: []

intake:
  # Срок нашего действия: не более одного рабочего дня
  next_step_working_days: 1
  # Контроль на 7-й календарный день, но не ранее истечения пятого рабочего дня
  follow_up_7_days: 7
  follow_up_min_working_days: 5
  # Контроль на 30-й день
  follow_up_30_days: 30
  # Как часто бот напоминает координатору о наступивших сроках
  reminder_interval: 30m
  districts:
    - "Автозаводский район"
    - "Центральный район"
    - "Комсомольский район"

logging:
  level: info
  format: console
  file: ""
