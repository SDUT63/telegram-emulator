# Конфигурация чат-бота службы «Точка входа» для мессенджера MAX.
#
# Токен бота выдаёт MasterBot в MAX. Не храните его в репозитории:
# передавайте через переменную окружения MAXBOT_BOT_TOKEN.

bot:
  token: ""              # переменная окружения MAXBOT_BOT_TOKEN
  api_url: ""            # пусто — адрес MAX Bot API по умолчанию
  mode: polling          # polling или webhook
  timeout: 30s
  debug: false
  webhook:
    url: ""              # публичный адрес, например https://example.org/webhook
    listen: ":10888"
    path: "/webhook"
    secret: ""           # произвольная строка, проверяется заголовком X-Max-Bot-Api-Secret

database:
  url: "sqlite://data/maxbot.db"

organization:
  name: "АНО «Система долговременного ухода Тольятти»"
  service_name: "Точка входа"
  phone: ""              # телефон службы, например +7 (8482) 00-00-00
  work_hours: "по будням с 9:00 до 18:00"
  public_url: ""         # ссылка на паблик СДУ в MAX
  policy_url: ""         # ссылка на политику обработки персональных данных

# Получатели карточек обращений внутри MAX.
# chat_id — рабочий чат координаторов, user_ids — личные сообщения координаторам.
# Свой идентификатор можно узнать командой /id в диалоге с ботом.
coordinator:
  chat_id: 0
  user_ids: []

intake:
  next_step_hours: 24    # срок нашего действия: один рабочий день
  districts:
    - "Автозаводский район"
    - "Центральный район"
    - "Комсомольский район"

# Закрытый перечень признаков экстренного состояния.
#
# ВНИМАНИЕ. Перечень разрабатывает и подписывает заведующий отделением
# паллиативной медицинской помощи. До получения подписанного перечня линия
# не открывается: при approved: false бот отвечает, что приём обращений
# не открыт, и называет телефон службы и номера 103 / 112.
#
# Приведённый ниже список — ЧЕРНОВИК для наладки бота. Замените его
# утверждённым перечнем, укажите, кто и когда его подписал, и только после
# этого поставьте approved: true. Формулировки задаются заявителю дословно.
stop1:
  approved: false
  approved_by: ""
  approved_at: ""
  signs:
    - id: s1
      question: "Человек сейчас без сознания или его не удаётся разбудить?"
    - id: s2
      question: "Человеку тяжело дышать прямо сейчас, он задыхается?"
    - id: s3
      question: "Есть кровотечение, которое не останавливается?"
    - id: s4
      question: "Внезапно перекосило лицо, отнялась рука или нога, нарушилась речь?"
    - id: s5
      question: "Есть сильная боль в груди, которая не проходит?"
    - id: s6
      question: "Была травма или падение, после которого человек не может встать?"
    - id: s7
      question: "Боль настолько сильная, что её невозможно терпеть прямо сейчас, и обезболивание не помогает?"
    - id: s8
      question: "Есть судороги, непрекращающаяся рвота или температура, которая не сбивается?"

logging:
  level: info
  format: console
  file: ""
