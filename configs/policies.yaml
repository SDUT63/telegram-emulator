# Утверждаемые правила службы «Точка входа».
#
# Этот файл — не настройки приложения, а нормативная часть: перечень признаков
# STOP-1, матрица маршрутов и профиль собираемых данных. Бот их только исполняет.
#
# Пока правило не отмечено approved: true, оно не применяется:
# перечень STOP-1 не утверждён — линия не открывается;
# матрица маршрутов не утверждена — предварительное направление не рассчитывается,
# и координатор получает только собранные факты.
#
# Каждое изменение — новая версия с указанием, кто и когда её утвердил.

# ---------------------------------------------------------------------------
# Перечень признаков возможного экстренного состояния.
#
# ВНИМАНИЕ. Перечень разрабатывает и подписывает заведующий отделением
# паллиативной медицинской помощи. Приведённые ниже формулировки — ЧЕРНОВИК
# для наладки бота, они не являются медицинским документом и не утверждены.
# Замените их подписанным перечнем, укажите версию, кто и когда утвердил,
# и только после этого поставьте approved: true.
#
# trigger — ответ, при котором признак считается выявленным (yes либо no).
# action  — что происходит при срабатывании; поддерживается STOP-1.
# ---------------------------------------------------------------------------
stop1:
  version: "draft"
  approved: false
  approved_by: ""
  approved_at: ""
  signs:
    - id: s1
      question: "Человек сейчас без сознания или его не удаётся разбудить?"
      trigger: "yes"
      action: "STOP-1"
    - id: s2
      question: "Человеку тяжело дышать прямо сейчас, он задыхается?"
      trigger: "yes"
      action: "STOP-1"
    - id: s3
      question: "Есть кровотечение, которое не останавливается?"
      trigger: "yes"
      action: "STOP-1"
    - id: s4
      question: "Внезапно перекосило лицо, отнялась рука или нога, нарушилась речь?"
      trigger: "yes"
      action: "STOP-1"
    - id: s5
      question: "Есть сильная боль в груди, которая не проходит?"
      trigger: "yes"
      action: "STOP-1"
    - id: s6
      question: "Была травма или падение, после которого человек не может встать?"
      trigger: "yes"
      action: "STOP-1"
    - id: s7
      question: "Боль настолько сильная, что её невозможно терпеть прямо сейчас, и обезболивание не помогает?"
      trigger: "yes"
      action: "STOP-1"
    - id: s8
      question: "Есть судороги, непрекращающаяся рвота или температура, которая не сбивается?"
      trigger: "yes"
      action: "STOP-1"

# ---------------------------------------------------------------------------
# Матрица маршрутов М1–М5.
#
# Правила ниже — перенос в конфигурацию той логики, которая была заложена
# в первой версии бота по приложению 3 методических рекомендаций. Они НЕ
# утверждены: маршрутизация — методический вопрос, а не программный.
# Проверьте формулировки, приоритеты и исключения, укажите версию и утвердившего.
#
# Правила проверяются по убыванию приоритета, срабатывает первое подходящее.
# Все условия одного правила должны выполняться одновременно.
#
# Доступные условия:
#   medical_need       — ответ о боли и медицинском контроле: yes, no, unknown
#   caregiver          — ответ об ухаживающем: daily, sometimes, none, unknown
#   lost_count         — число позиций самообслуживания «не может» (0–3)
#   partial_count      — число позиций «только с помощью» (0–3)
#   limited_count      — сумма двух предыдущих
#   unknown_count      — число позиций «не знаю»
#   additional_spheres — число отмеченных дополнительных сфер потребности
#   answers_complete   — заявитель ответил на все различающие вопросы: true, false
#
# Числовые условия задаются сравнением: ">=3", ">0", "=0".
# Перечисления задаются списком через запятую: "daily, sometimes".
# ---------------------------------------------------------------------------
routing:
  version: "draft"
  approved: false
  approved_by: ""
  approved_at: ""
  rules:
    - id: R010
      priority: 100
      conditions:
        answers_complete: "false"
      route: "М4"
      reason: "заявитель не смог ответить на часть вопросов, картина неясна"

    - id: R020
      priority: 90
      conditions:
        additional_spheres: ">0"
        limited_count: ">0"
      route: "М5"
      reason: "потребность охватывает две и более сферы одновременно"

    - id: R021
      priority: 90
      conditions:
        additional_spheres: ">0"
        medical_need: "yes"
      route: "М5"
      reason: "потребность охватывает две и более сферы одновременно"

    - id: R030
      priority: 80
      conditions:
        medical_need: "yes"
      route: "М1"
      reason: "со слов заявителя есть боль, которая не снимается, либо нужен медицинский контроль на дому"

    - id: R040
      priority: 70
      conditions:
        lost_count: ">=3"
      route: "М3"
      reason: "значительная утрата самообслуживания по трём позициям"

    - id: R050
      priority: 60
      conditions:
        limited_count: ">0"
        caregiver: "daily, sometimes"
      route: "М2"
      reason: "частичная утрата самообслуживания, ухаживающий есть, медицинский контроль не требуется"

    - id: R060
      priority: 50
      conditions:
        limited_count: ">0"
        caregiver: "none"
      route: "М4"
      reason: "утрата самообслуживания при отсутствии ухаживающего — уровень нуждаемости определяет эксперт"

    - id: R070
      priority: 10
      conditions:
        limited_count: "=0"
        medical_need: "no"
      route: "М4"
      reason: "признаков ограничений самообслуживания не зафиксировано, потребность требует уточнения"

# ---------------------------------------------------------------------------
# Профиль собираемых данных: что бот спрашивает и что не спрашивает никогда.
# Версия профиля указывается в карточке координатора вместо фразы,
# зашитой в код, — чтобы при изменении анкеты она не осталась неверной.
# ---------------------------------------------------------------------------
data_collection:
  version: "DC-2026-01"
  collect:
    - "дата, время и канал обращения"
    - "ФИО и телефон заявителя, кем приходится подопечному"
    - "ФИО и возраст подопечного, знает ли он об обращении"
    - "район и адрес"
    - "суть обращения со слов заявителя"
    - "ограничения самообслуживания и наличие ухаживающего"
    - "дополнительные сферы потребности"
    - "контактное лицо и удобное время звонка"
  excluded:
    - "диагноз, назначения и медицинские документы"
    - "СНИЛС, полис, паспортные данные"
    - "сведения о доходах, имуществе и составе семьи"
